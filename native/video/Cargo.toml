[package]
name = "pixi_node_video"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[features]
default = []
native-ffmpeg = ["dep:rsmpeg"]

[dependencies]
napi = { version = "3.12.2", features = ["napi9"] }
napi-derive = "3.2.5"
rsmpeg = { version = "0.18.0", optional = true, default-features = false, features = ["ffmpeg8"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54.0", features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
] }

[build-dependencies]
napi-build = "2.2.3"
